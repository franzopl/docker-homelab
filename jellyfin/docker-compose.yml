services:
  jellyfin:
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Recife
    volumes:
      - ../services/jellyfin:/config
      - /media:/media
      - /home/francisco/docker-homelab/services/npm/letsencrypt/:/config/ssl/:ro
    devices:
     - /dev/dri:/dev/dri
