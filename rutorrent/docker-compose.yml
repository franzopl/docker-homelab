services:
  rutorrent:
    image: crazymax/rtorrent-rutorrent:5.2.9-0.15.4
    container_name: rutorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Recife
      - MEMORY_LIMIT=4096M # Define o cache diretamente via variável nesta imagem
    volumes:
      - ../services/rutorrent/config:/data
      - /media/ironwolf/downloads:/downloads
      - /media:/media
    ports:
      - 8082:8080
      - 5000:5000
      - 51413:51413
      - 6881:6881/udp
    ulimits:
      nproc: 65535
      nofile:
        soft: 50000
        hard: 50000
    restart: unless-stopped
