services:
  protonvpn-CBR:
    image: docker.io/qmcgaw/gluetun:v3.41.3
    container_name: protonvpn-CBR
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - PORT_FORWARD_ONLY=on
      # Melhoria no DNS: Desativa DOT e força DNS público para evitar erro de host
      - DOT=off
      - DNS_KEEP_NAMESERVERS=off
      - DNS_ADDRESS=1.1.1.1
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    volumes:
      - ./vpn:/gluetun
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
    restart: unless-stopped
    # Garante que outros containers saibam quando a VPN está pronta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true

  qbittorrent-CBR:
    image: lscr.io/linuxserver/qbittorrent:5.2.3-libtorrentv1
    container_name: qbittorrent-CBR
    depends_on:
      protonvpn-CBR:
        condition: service_healthy
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ../services/qbittorrent-CBR/config:/config
      - /media/:/media/
      - /home/:/home/
      - /media/barracuda/downloads:/downloads
    network_mode: "service:protonvpn-CBR"
    restart: unless-stopped
    # Desativar IPv6 evita erros de "Host not found" em túneis VPN IPv4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 6g
    mem_reservation: 4g
