services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2-libtorrentv1
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK=022
      - WEBUI_PORT=8081
    volumes:
      - ../services/qbittorrent:/config
      - /media:/media
      - /home:/home
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 6g
    mem_reservation: 4g
    restart: unless-stopped
    network_mode: host
