---
services:
  nzbget:
    image: lscr.io/linuxserver/nzbget
    container_name: nzbget
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - NZBGET_USER=${NZBGET_USER}     #optional
      - NZBGET_PASS=${NZBGET_PASS}
    volumes:
      - ../services/nzbget:/config
      - /media/ironwolf/downloads/:/downloads #optional
      - /media:/media
      - /home:/home


    ports:
      - 6789:6789
    restart: unless-stopped
