services:
  protonvpn-ipv6:
    image: qmcgaw/gluetun:v3.41.3
    container_name: protonvpn-ipv6
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: .env
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # IMPORTANT: Gluetun needs an internal IPv6 address to assign to tun0.
      # Replacing the second address with the one from your Proton .conf is best.
      - WIREGUARD_ADDRESSES=10.2.0.2/32,fd00:0000:0000:0000::2/128
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - PORT_FORWARD_ONLY=on
      - WIREGUARD_MTU=1280
      - DNS_UPSTREAM_IPV6=on
      - VPN_IPv6=on
      - DOT_IPV6=yes
      - DNS_KEEP_NAMESERVER=no
      # Updated command for qbittorrent-ipv6 service
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    volumes:
      - ./vpn-ipv6:/gluetun
    ports:
      - 8085:${QBITTORRENT_WEBUI_PORT}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0  # Forces IPv6 to stay enabled in container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - vpn_net_ipv6

  qbittorrent-ipv6:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-ipv6
    depends_on:
      protonvpn-ipv6:
        condition: service_healthy
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ../services/qbittorrent-ipv6/config:/config
      - /media/:/media/
      - /home/:/home/
    network_mode: "service:protonvpn-ipv6" # Shares the VPN network stack
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

networks:
  vpn_net_ipv6:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.16.238.0/24
        # Use a private "ULA" range here to avoid the overlap error
        - subnet: fd00:dead:beef::/64
