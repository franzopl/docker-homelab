services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr   # ou o nome que você usou; o seu atual é jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      - TZ=America/Recife        # ou America/Fortaleza se preferir
      - LOG_LEVEL=debug
    volumes:
      - /home/francisco/docker-homelab/services/jellyseerr/config:/app/config
    # Opcional: adicione healthcheck da doc oficial
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
